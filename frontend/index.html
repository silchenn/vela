<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>Vela</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed WebGL universe; glass HUD pinned to the four corners like a ship's bridge console. Single dark look by design. */
:root{
  --void:#03050b;
  --ink:#d6e2f0;
  --dim:#7f8ca6;
  --faint:#4a5670;
  --panel:rgba(7,12,24,.74);
  --edge:rgba(110,160,220,.16);
  --edge-hi:rgba(45,226,230,.45);
  --https:#2de2e6;
  --http:#eef3ff;
  --dns:#b26bff;
  --quic:#ffb347;
  --alert:#ff2a5f;
  --f-display:"Chakra Petch","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.label{position:absolute;left:0;top:0;transform:translate(-50%,0);white-space:nowrap;pointer-events:auto;cursor:pointer;
  font-family:var(--f-body);font-size:12px;color:var(--ink);text-shadow:0 0 6px #000,0 0 2px #000;text-align:center;line-height:1.25;padding:2px 4px;border-radius:4px}
.label .r{display:block;font-family:var(--f-mono);font-size:10px;color:var(--https);opacity:.9}
.label .r:empty{display:none}
.label.off{color:var(--faint)} .label.off .r{color:var(--faint)}
.label.sel{background:rgba(45,226,230,.12);outline:1px solid var(--edge-hi)}
.label.alert .r{color:var(--alert)}
.label:focus-visible{outline:2px solid var(--https)}

.hud{position:fixed;z-index:5;background:var(--panel);border:1px solid var(--edge);border-radius:10px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.k{font-family:var(--f-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.tl{top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none}
.tl h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:30px;letter-spacing:.06em;color:#fff;text-shadow:0 0 18px rgba(45,226,230,.55)}
.tl p{margin:4px 0 0;font-size:12px;color:var(--dim)}
.tl .sw{display:inline-block;margin-top:6px;font-size:11px;color:var(--https);text-decoration:none;border-bottom:1px dashed var(--edge-hi)}
.tl .sw:hover{color:#fff}
.tag{font-family:var(--f-mono);font-size:10px;color:var(--quic);border:1px solid rgba(255,179,71,.4);padding:1px 6px;border-radius:3px;margin-left:4px}

.tr{top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:272px;padding:14px 16px 12px}
.big{font-family:var(--f-display);font-size:34px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px}
.dir{display:flex;gap:14px;font-family:var(--f-mono);font-size:12px;color:var(--dim);margin-top:4px}
.dir b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
#spark{display:block;width:100%;height:44px;margin:10px 0 8px}
.counts{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);border-top:1px solid var(--edge);padding-top:8px}
.counts b{font-family:var(--f-mono);color:var(--https);font-weight:500;margin-right:3px}

.bl{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:272px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px}
.scen{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn{appearance:none;font:inherit;color:var(--ink);background:rgba(255,255,255,.03);border:1px solid var(--edge);border-radius:7px;padding:8px 9px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:border-color .2s,background .2s}
.btn:hover{border-color:rgba(110,160,220,.4)}
.btn:focus-visible{outline:2px solid var(--https);outline-offset:1px}
.btn .t{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.btn .t::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
.btn .d{font-family:var(--f-mono);font-size:10px;color:var(--dim)}
.btn[aria-pressed="true"]{border-color:var(--edge-hi);background:rgba(45,226,230,.08)}
.btn[aria-pressed="true"] .t::before{background:var(--https);box-shadow:0 0 8px var(--https)}
.btn.danger[aria-pressed="true"]{border-color:rgba(255,42,95,.55);background:rgba(255,42,95,.09)}
.btn.danger[aria-pressed="true"] .t::before{background:var(--alert);box-shadow:0 0 8px var(--alert)}
.btn.wide{grid-column:span 2}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;font-family:var(--f-mono);font-size:11px;color:var(--ink);background:transparent;border:1px solid var(--edge);border-radius:20px;padding:4px 9px 4px 7px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.chip[aria-pressed="false"]{opacity:.38}
.chip[aria-pressed="false"] i{box-shadow:none}
.chip:focus-visible{outline:2px solid var(--https)}
.row{display:flex;gap:6px}
.row .btn{flex:1;flex-direction:row;align-items:center;justify-content:center;font-size:12px;padding:7px}
.row .btn .t::before{display:none}
.hint{font-size:11px;color:var(--faint)}

.br{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:340px;padding:12px 14px}
#log{list-style:none;margin:8px 0 0;padding:0;font-family:var(--f-mono);font-size:11px;line-height:1.75;min-height:calc(1.75em * 7)}
#log li{display:flex;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:in .35s ease-out}
#log time{color:var(--faint);flex:none}
#log .m{overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
#log .p{flex:none}
#log li.alert .m{color:var(--alert)}
@keyframes in{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:none}}
details{margin-top:8px;border-top:1px solid var(--edge);padding-top:8px}
summary{cursor:pointer;font-size:11px;color:var(--dim)}
summary:focus-visible{outline:2px solid var(--https)}
pre{margin:6px 0 0;font-family:var(--f-mono);font-size:10.5px;color:var(--https);white-space:pre-wrap;word-break:break-all;background:rgba(0,0,0,.3);padding:8px;border-radius:6px}

#panel{right:max(16px,env(safe-area-inset-right,0px));top:calc(232px + env(safe-area-inset-top,0px));width:272px;padding:14px 16px}
#panel h2{margin:2px 0 0;font-family:var(--f-display);font-size:22px;font-weight:600;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px}
#panel .ip{font-family:var(--f-mono);font-size:11px;color:var(--dim);margin-top:2px}
#panel .stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
#panel .stat div{display:flex;flex-direction:column}
#panel .stat span{font-size:11px;color:var(--dim)}
#panel .stat b{font-family:var(--f-mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
#pbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.05)}
#pbar span{height:100%;transition:width .4s}
#plist{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-family:var(--f-mono);font-size:10.5px;color:var(--dim)}
#plist i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle}
#nspark{display:block;width:100%;height:40px;margin-top:10px}
.x{appearance:none;background:none;border:1px solid var(--edge);color:var(--dim);border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:14px;line-height:1;flex:none}
.x:focus-visible{outline:2px solid var(--https)}
.state{font-size:11px;font-family:var(--f-mono);padding:1px 6px;border-radius:3px;border:1px solid var(--edge);color:var(--https)}
.state.off{color:var(--faint)}

#alert{position:fixed;z-index:6;left:50%;transform:translateX(-50%);top:calc(18px + env(safe-area-inset-top,0px));
  font-family:var(--f-mono);font-size:12px;color:#fff;background:rgba(80,6,24,.82);border:1px solid var(--alert);border-radius:8px;padding:8px 14px;
  box-shadow:0 0 24px rgba(255,42,95,.45);white-space:nowrap;animation:blink 1.1s infinite}
#alert b{color:var(--alert);font-weight:500}
@keyframes blink{50%{box-shadow:0 0 6px rgba(255,42,95,.2)}}

@media (max-width:900px){
  .br{display:none}
  #panel{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:7}
}
@media (max-width:640px){
  .tl h1{font-size:22px}
  .tl p{font-size:11px}
  .tr{width:auto;left:auto;top:calc(70px + env(safe-area-inset-top,0px));padding:10px 12px}
  .tr .k{font-size:10px}
  .big{font-size:22px}
  #spark,.counts{display:none}
  .bl{width:auto;right:max(16px,env(safe-area-inset-right,0px));padding:10px;gap:8px}
  .scen{grid-template-columns:repeat(3,1fr)}
  .btn .d{display:none}
  .btn.wide{grid-column:auto}
  .hint{display:none}
  #panel{left:max(16px,env(safe-area-inset-left,0px));width:auto}
  #alert{font-size:10.5px;top:calc(120px + env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){ #log li{animation:none} #alert{animation:none} }
</style>

<canvas id="c" aria-label="网络流量三维星图"></canvas>
<div id="labels"></div>

<header class="hud tl">
  <h1>Vela</h1>
  <p>分布式网络宇宙观测站<span class="tag">模拟数据</span></p>
  <a class="sw" href="cyber.html">切换到赛博朋克风格 →</a>
</header>

<section class="hud tr" aria-label="总吞吐">
  <div class="k">总吞吐</div>
  <div class="big" id="total">0 B/s</div>
  <div class="dir"><span>↓ <b id="down">0</b></span><span>↑ <b id="up">0</b></span></div>
  <canvas id="spark"></canvas>
  <div class="counts"><span><b id="nFlows">0</b>条航道活跃</span><span><b id="nNodes">0</b>颗恒星在线</span></div>
</section>

<aside class="hud bl" aria-label="控制台">
  <div class="k">演练场景</div>
  <div class="scen">
    <button class="btn" id="s-download" data-s="download" aria-pressed="false"><span class="t">下载大文件</span><span class="d">Steam → 本机 · 62 MB/s</span></button>
    <button class="btn" id="s-video" data-s="video" aria-pressed="false"><span class="t">4K 视频</span><span class="d">视频 CDN → 电视 · QUIC</span></button>
    <button class="btn" id="s-dns" data-s="dnsstorm" aria-pressed="false"><span class="t">DNS 风暴</span><span class="d">全屋设备高频寻路</span></button>
    <button class="btn danger" id="s-scan" data-s="scan" aria-pressed="false"><span class="t">端口扫描</span><span class="d">外部主机探测网关</span></button>
    <button class="btn danger wide" id="s-nas" data-s="nasdown" aria-pressed="false"><span class="t">NAS 宕机</span><span class="d">超新星爆发 → 化为陨石</span></button>
  </div>
  <div class="k">协议图谱 · 点击筛选</div>
  <div class="legend" id="legend"></div>
  <div class="row">
    <button class="btn" id="sound" aria-pressed="false"><span class="t">开启舰桥音效</span></button>
    <button class="btn" id="home"><span class="t">返回全景</span></button>
  </div>

</aside>

</section>

<section class="hud" id="panel" hidden aria-live="polite">
  <div class="k" id="pkind">恒星</div>
  <h2><span id="pname">—</span><button class="x" id="pclose" aria-label="关闭">✕</button></h2>
  <div class="ip"><span id="pip"></span> · <span class="state" id="pstate">在线</span></div>
  <div class="stat">
    <div><span>进港 ↓</span><b id="pin">0</b></div>
    <div><span>出港 ↑</span><b id="pout">0</b></div>
    <div><span>相连航道</span><b id="plinks">0</b></div>
    <div><span>累计流量</span><b id="ptot">0</b></div>
  </div>
  <div id="pbar"></div>
  <div id="plist"></div>

</section>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);

/* ---------- protocol palette ---------- */
const PROTO = {
  https:{name:'HTTPS',port:443,hex:'#2de2e6'},
  quic:{name:'QUIC',port:443,hex:'#ffb347'},
  http:{name:'HTTP',port:80,hex:'#eef3ff'},
  dns:{name:'DNS',port:53,hex:'#b26bff'},
  alert:{name:'异常',port:0,hex:'#ff2a5f'},
};
const protoOn = {};
for (const k in PROTO){ PROTO[k].color = new THREE.Color(PROTO[k].hex); protoOn[k] = true; }

/* ---------- formatting ---------- */
const fmt = b => b < 1024 ? b.toFixed(0)+' B/s' : b < 1048576 ? (b/1024).toFixed(1)+' KB/s' : (b/1048576).toFixed(1)+' MB/s';
const fmtB = b => b < 1048576 ? (b/1024).toFixed(0)+' KB' : b < 1073741824 ? (b/1048576).toFixed(1)+' MB' : (b/1073741824).toFixed(2)+' GB';
const clock = () => new Date().toTimeString().slice(0,8);
const rand = (a,b) => a + Math.random()*(b-a);
const pick = a => a[(Math.random()*a.length)|0];

/* ---------- nodes ---------- */
const NODE_DEFS = [
  {id:'router', name:'路由器', ip:'192.168.1.1', kind:'网关', size:2.2, hex:'#9fe9ff'},
  {id:'pc', name:'本机', ip:'192.168.1.10', kind:'工作站', size:1.4, hex:'#2de2e6', lan:true},
  {id:'nas', name:'NAS', ip:'192.168.1.20', kind:'存储', size:1.5, hex:'#7fd8ff', lan:true},
  {id:'tv', name:'客厅电视', ip:'192.168.1.30', kind:'终端', size:1.1, hex:'#9ab8ff', lan:true},
  {id:'phone', name:'手机', ip:'192.168.1.41', kind:'终端', size:0.9, hex:'#a9c4ff', lan:true},
  {id:'laptop', name:'笔记本', ip:'192.168.1.42', kind:'终端', size:1.0, hex:'#a9c4ff', lan:true},
  {id:'iot', name:'智能音箱', ip:'192.168.1.55', kind:'IoT', size:0.7, hex:'#c4b3ff', lan:true},
  {id:'gh', name:'GitHub', ip:'140.82.112.3', kind:'AS36459', size:1.5, hex:'#e6edf7'},
  {id:'cf', name:'Cloudflare', ip:'104.16.132.229', kind:'AS13335 · CDN', size:1.6, hex:'#ffc58a'},
  {id:'g', name:'Google', ip:'142.250.199.78', kind:'AS15169', size:1.7, hex:'#9fe0ff'},
  {id:'yt', name:'视频 CDN', ip:'172.217.24.14', kind:'AS15169 · 流媒体', size:1.6, hex:'#ffb38a'},
  {id:'aws', name:'AWS 东京', ip:'54.239.98.12', kind:'AS16509 · 云服务', size:1.5, hex:'#ffd28a'},
  {id:'ali', name:'阿里云', ip:'47.246.24.233', kind:'AS45102 · 云服务', size:1.4, hex:'#ffb47a'},
  {id:'steam', name:'Steam 下载', ip:'23.52.74.17', kind:'AS32590 · CDN', size:1.5, hex:'#a4c8ff'},
  {id:'ms', name:'Microsoft', ip:'20.190.151.70', kind:'AS8075', size:1.5, hex:'#a9f0d0'},
  {id:'bili', name:'哔哩哔哩', ip:'119.3.70.188', kind:'AS55990 · 视频', size:1.3, hex:'#ff9fd0'},
  {id:'vps', name:'我的 VPS', ip:'203.0.113.24', kind:'云服务器 · 备份目标', size:1.3, hex:'#c8ffb0'},
  {id:'dns1', name:'1.1.1.1', ip:'1.1.1.1', kind:'DNS 解析器', size:1.0, hex:'#c79bff'},
  {id:'dns2', name:'8.8.8.8', ip:'8.8.8.8', kind:'DNS 解析器', size:1.0, hex:'#c79bff'},
  {id:'scanner', name:'未知主机', ip:'45.155.205.233', kind:'可疑 · 无反向解析', size:1.1, hex:'#ff2a5f', hidden:true},
];
const NODES = [], N = {};

/* ---------- three setup ---------- */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
const PR = Math.min(devicePixelRatio || 1, 1.75);
renderer.setPixelRatio(PR);
renderer.setClearColor(0x03050b, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 2000);
const HOME_POS = new THREE.Vector3(0, 48, innerWidth/innerHeight < 0.8 ? 175 : 118);
camera.position.copy(HOME_POS);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 6; controls.maxDistance = 320;
controls.autoRotate = !REDUCED; controls.autoRotateSpeed = 0.28;

let composer = null, bloom = null;
if (THREE.EffectComposer && THREE.UnrealBloomPass){
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.15, 0.55, 0.06);
  composer.addPass(bloom);
}

function glowTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.12,'rgba(255,255,255,.7)');
  gr.addColorStop(.35,'rgba(255,255,255,.16)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const GLOW = glowTexture();

/* starfield + galactic dust */
(function stars(){
  const n = 2600, pos = new Float32Array(n*3), col = new Float32Array(n*3);
  for (let i=0;i<n;i++){
    const r = rand(380,900), th = Math.random()*Math.PI*2, ph = Math.acos(rand(-1,1));
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.cos(ph); pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
    const t = Math.random(), b = rand(.35,.95);
    col[i*3]=b*(t<.2?.8:1); col[i*3+1]=b*(t<.2?.85:.95); col[i*3+2]=b;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));

const segs = {}, segList = [];
function getSeg(A, B){
  const key = A.id < B.id ? A.id+'|'+B.id : B.id+'|'+A.id;
  if (segs[key]) return segs[key];
  const a = A.id < B.id ? A : B, b = a === A ? B : A;
  const mid = a.pos.clone().add(b.pos).multiplyScalar(.5), d = a.pos.distanceTo(b.pos);
  const out = mid.clone(); out.y = 0;
  if (out.length() > .1) out.normalize().multiplyScalar(d*.06); else out.set(0,0,0);
  const c = mid.add(out); c.y += d*.16;
  const s = {key, a:a.id, p0:a.pos, c, p2:b.pos, load:0, tload:0, proto:'https', col:new THREE.Color(0x2a5a7a), line:null, tube:null};
  const pts = []; for (let i=0;i<=48;i++){ const t=i/48; pts.push(bez(s,t,new THREE.Vector3())); }
  s.line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:s.col.clone(), transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false}));
  scene.add(s.line);

}
function bez(s, v, out){
  const w = 1-v;
  out.x = w*w*s.p0.x + 2*w*v*s.c.x + v*v*s.p2.x;
  out.y = w*w*s.p0.y + 2*w*v*s.c.y + v*v*s.p2.y;
  out.z = w*w*s.p0.z + 2*w*v*s.c.z + v*v*s.p2.z;

}

const MAXH = 5200, TAIL = 5, PPH = TAIL+1, MAXP = MAXH*PPH;

const pMat = new THREE.ShaderMaterial({
  uniforms:{uScale:{value:1}},

    void main(){ vC=color; vA=alpha; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=max(1.5, size*uScale/-mv.z); gl_Position=projectionMatrix*mv; }`,

const heads = [];

function spawnHead(f, rev, t0 = 0){
  if (heads.length >= MAXH) return;
  const rate = rev ? f.down : f.up;
  const L = Math.log10(1 + Math.max(rate, 200)/5000);
  const spread = .12 + .14*L;
  heads.push({
    segs: rev ? f.bw : f.fw, nseg: f.fw.length, t: t0,
    speed: (.32 + .24*L) * rand(.85,1.15),
    size: .8 + .3*L, gap: .016 + .006*L,
    proto: f.proto, col: PROTO[f.proto].color,
    ox: rand(-1,1)*spread, oy: rand(-1,1)*spread, oz: rand(-1,1)*spread,
    dest: rev ? f.nodes[0] : f.nodes[f.nodes.length-1],
  });
}

function headPos(h, gt, out){
  if (gt < 0) gt = 0; const mx = h.nseg - 1e-4; if (gt > mx) gt = mx;

  const b = Math.sin(Math.PI*u);

}

const flows = new Map(); let flowSeq = 0;
function addFlow(o){
  const nodes = o.path.map(id => N[id]);
  if (nodes.some(n => !n.online)) return null;
  const fw = [], bw = [];
  for (let i=0;i<nodes.length-1;i++) fw.push({seg:getSeg(nodes[i],nodes[i+1]), from:nodes[i].id});
  for (let i=nodes.length-1;i>0;i--) bw.push({seg:getSeg(nodes[i],nodes[i-1]), from:nodes[i].id});
  const f = {id:++flowSeq, nodes, fw, bw, proto:o.proto, port:o.port ?? PROTO[o.proto].port,
    up:o.up||0, down:o.down||0, baseUp:o.up||0, baseDown:o.down||0, ttl:o.ttl ?? Infinity, tag:o.tag||null,
    jitter:o.jitter !== false, acc:[Math.random(),Math.random()]};
  flows.set(f.id, f);
  for (let i=0;i<(o.burst||0);i++) spawnHead(f, o.burstDir === 'down', -i*rand(.03,.09));
  if (o.log) emit(f, o.log === 'alert' ? 'alert' : '');
  return f;
}

/* ---------- simulation tick (200 ms, like a backend aggregation window) ---------- */
let totUp = 0, totDown = 0, totalHist = [];
function simTick(){
  const dt = .2;
  persistent(); background(); scenarios();
  for (const n of NODES){ n._in = 0; n._out = 0; n._links = new Set(); }
  for (const s of segList){ s._load = 0; s._pb = {}; }
  let up = 0, down = 0;
  for (const [id,f] of flows){
    f.ttl -= dt;
    if (f.ttl <= 0 || f.nodes.some(n => !n.online)){ flows.delete(id); continue; }
    if (f.jitter){ f.up = f.baseUp*rand(.78,1.22); f.down = f.baseDown*rand(.78,1.22); }
    const a = f.nodes[0], z = f.nodes[f.nodes.length-1], both = f.up + f.down;
    a._out += f.up; a._in += f.down; z._in += f.up; z._out += f.down;
    for (let i=1;i<f.nodes.length-1;i++){ f.nodes[i]._in += both; f.nodes[i]._out += both; }
    f.nodes.forEach((n,i) => { n.pb[f.proto] = (n.pb[f.proto]||0) + both*dt; if (i>0) n._links.add(f.nodes[i-1].id); if (i<f.nodes.length-1) n._links.add(f.nodes[i+1].id); });
    for (const s of f.fw){ s.seg._load += both; s.seg._pb[f.proto] = (s.seg._pb[f.proto]||0) + both; }
    if (a.lan || a.id === 'scanner'){ up += f.up; down += f.down; }
  }
  for (const n of NODES){
    n.inRate = n._in; n.outRate = n._out; n.total += (n._in + n._out)*dt; n.links = n._links.size;
    for (const k in n.pb) n.pb[k] *= .985;
  }
  for (const s of segList){
    s.tload = s._load;
    let best = 'https', bv = -1; for (const k in s._pb) if (s._pb[k] > bv){ bv = s._pb[k]; best = k; }
    s.proto = best;
    if (s.tload > 1.5e6 && !s.tube) makeTube(s);
  }
  totUp = up; totDown = down;
  if (audio) audioUpdate();
}

  for (const n of NODES){ n.hist.push(n.inRate + n.outRate); if (n.hist.length > 120) n.hist.shift(); }

function drawSpark(cv, data, color){
  const w = cv.clientWidth, h = cv.clientHeight; if (!w) return;
  const dpr = devicePixelRatio || 1;

  const g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  g.strokeStyle = 'rgba(110,160,220,.12)'; g.lineWidth = 1;
  for (let i=1;i<3;i++){ g.beginPath(); g.moveTo(0, h*i/3+.5); g.lineTo(w, h*i/3+.5); g.stroke(); }
  if (data.length < 2) return;
  const lg = v => Math.log10(1 + v/1000);
  const mx = Math.max(1, ...data.map(lg)), n = 120;
  const X = i => w - (data.length-1-i)*(w/(n-1)), Y = v => h - 3 - lg(v)/mx*(h-8);

  g.lineTo(X(data.length-1), h); g.lineTo(X(0), h); g.closePath(); g.fillStyle = grad; g.fill();
  g.beginPath(); data.forEach((v,i) => i ? g.lineTo(X(i),Y(v)) : g.moveTo(X(i),Y(v)));
  g.strokeStyle = color; g.lineWidth = 1.5; g.stroke();
  const lx = X(data.length-1), ly = Y(data[data.length-1]);
  g.beginPath(); g.arc(lx-2, ly, 2.5, 0, 6.29); g.fillStyle = '#fff'; g.fill();
}

/* ---------- legend ---------- */
const legend = $('legend');
for (const k in PROTO){
  const b = document.createElement('button'); b.className = 'chip'; b.setAttribute('aria-pressed','true');
  b.style.setProperty('--c', PROTO[k].hex);
  b.innerHTML = `<i></i>${PROTO[k].name}${PROTO[k].port ? ' · '+PROTO[k].port : ''}`;
  b.addEventListener('click', () => { protoOn[k] = !protoOn[k]; b.setAttribute('aria-pressed', protoOn[k]); });
  legend.appendChild(b);
}

/* ---------- focus / camera flight ---------- */
let focus = null, tween = null;
function flyTo(pos, target, dur = 1.3){
  tween = {p0:camera.position.clone(), p1:pos, t0:controls.target.clone(), t1:target, s:performance.now(), d:REDUCED ? .01 : dur*1000};
}
function focusNode(n){
  if (!n.visible) return;
  if (focus) focus.el.classList.remove('sel');
  focus = n; n.el.classList.add('sel');
  const out = n.pos.clone(); out.y = 0;
  if (out.length() < .1) out.set(0,0,1);
  out.normalize();
  const dist = n.id === 'router' ? 30 : n.lan ? 16 : 18 + n.size*4;
  const camPos = n.pos.clone().add(out.multiplyScalar(dist)).add(new THREE.Vector3(0, dist*.45, 0));
  flyTo(camPos, n.pos.clone());
  controls.autoRotate = false;
  $('panel').hidden = false;
  updatePanel(true);
  drawSpark($('nspark'), n.hist, n.baseColor.getStyle());
}
function goHome(){
  if (focus) focus.el.classList.remove('sel');
  focus = null; $('panel').hidden = true;
  flyTo(HOME_POS.clone(), new THREE.Vector3());
  controls.autoRotate = !REDUCED;
}
$('home').addEventListener('click', goHome);
$('pclose').addEventListener('click', goHome);
addEventListener('keydown', e => { if (e.key === 'Escape') goHome(); });

function updatePanel(force){
  if (!focus || $('panel').hidden) return;
  const n = focus;
  $('pname').textContent = n.name; $('pkind').textContent = n.kind; $('pip').textContent = n.ip;
  const st = $('pstate'); st.textContent = n.online ? '在线' : '离线 · 陨石'; st.classList.toggle('off', !n.online);
  $('pin').textContent = fmt(n.inRate); $('pout').textContent = fmt(n.outRate);
  $('plinks').textContent = n.links; $('ptot').textContent = fmtB(n.total);
  const sum = Object.values(n.pb).reduce((a,b)=>a+b, 0) || 1;
  const keys = Object.keys(PROTO).filter(k => (n.pb[k]||0)/sum > .005);
  $('pbar').innerHTML = keys.map(k => `<span style="width:${(n.pb[k]/sum*100).toFixed(1)}%;background:${PROTO[k].hex}"></span>`).join('');
  $('plist').innerHTML = keys.map(k => `<span><i style="background:${PROTO[k].hex}"></i>${PROTO[k].name} ${(n.pb[k]/sum*100).toFixed(0)}%</span>`).join('') || '<span>暂无流量</span>';
}

/* picking */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
canvas.addEventListener('pointerdown', e => { down = {x:e.clientX, y:e.clientY}; if (tween) tween = null; });
canvas.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX-down.x, e.clientY-down.y) > 6) return;
  ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(hits.filter(h => h.userData.node.visible))[0];
  if (hit) focusNode(hit.object.userData.node);
});

/* ---------- audio ---------- */
let audio = null;
function startAudio(){
  const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
  const ctx = new Ctx();
  const master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
  const filt = ctx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 260; filt.Q.value = 7; filt.connect(master);
  [[55,'sawtooth',.16],[55.35,'sawtooth',.16],[82.41,'triangle',.22],[110.2,'sine',.08]].forEach(([f,t,v]) => {
    const o = ctx.createOscillator(); o.type = t; o.frequency.value = f;
    const g = ctx.createGain(); g.gain.value = v; o.connect(g); g.connect(filt); o.start();
  });
  const lfo = ctx.createOscillator(); lfo.frequency.value = .06;
  const lg = ctx.createGain(); lg.gain.value = 110; lfo.connect(lg); lg.connect(filt.frequency); lfo.start();
  master.gain.linearRampToValueAtTime(.32, ctx.currentTime + 2.5);
  audio = {ctx, master, filt, on:true};
}
function audioUpdate(){
  if (!audio.on) return;
  const L = Math.log10(1 + (totUp+totDown)/1e4);
  audio.filt.frequency.setTargetAtTime(220 + L*240, audio.ctx.currentTime, .8);
}
let lastBlip = 0;
function blip(){
  if (!audio || !audio.on) return;
  const now = audio.ctx.currentTime; if (now - lastBlip < .25) return; lastBlip = now;
  const o = audio.ctx.createOscillator(), g = audio.ctx.createGain();
  o.type = 'square'; o.frequency.setValueAtTime(1320, now); o.frequency.exponentialRampToValueAtTime(660, now+.12);
  g.gain.setValueAtTime(.05, now); g.gain.exponentialRampToValueAtTime(.0001, now+.15);
  o.connect(g); g.connect(audio.ctx.destination); o.start(now); o.stop(now+.16);
}
$('sound').addEventListener('click', () => {
  const b = $('sound');
  if (!audio){ startAudio(); }
  else if (audio.on){ audio.on = false; audio.ctx.suspend(); }
  else { audio.on = true; audio.ctx.resume(); }
  const on = !!audio && audio.on;
  b.setAttribute('aria-pressed', on); b.querySelector('.t').textContent = on ? '关闭舰桥音效' : '开启舰桥音效';
});

/* ---------- resize ---------- */
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
  if (composer){ composer.setSize(w, h); bloom.setSize(w, h); }
  pMat.uniforms.uScale.value = .35 * h * PR / (2*Math.tan(camera.fov*Math.PI/360));
}
addEventListener('resize', resize); resize();

/* ---------- frame loop ---------- */
const clockT = new THREE.Clock(); let time = 0;
const tmpC = new THREE.Color(), red = new THREE.Color('#ff2a5f'), grey = new THREE.Color('#3a404c');
const proj = new THREE.Vector3();
function frame(){
  const dt = Math.min(clockT.getDelta(), .05); time += dt;

  /* emit particles from flows */
  for (const f of flows.values()){
    if (!protoOn[f.proto]) continue;
    for (let d=0; d<2; d++){
      const rate = d ? f.down : f.up; if (rate < 300 && f.proto !== 'alert') continue;
      const L = Math.log10(1 + rate/5000);
      const e = f.proto === 'dns' || f.proto === 'alert' ? 0 : Math.min(140, .9 + 1.5*Math.pow(L, 2.6));
      f.acc[d] += e*dt;
      while (f.acc[d] >= 1){ f.acc[d] -= 1; spawnHead(f, d === 1); }
    }
  }

  /* advance + write particles */
  for (let i=heads.length-1; i>=0; i--){
    const h = heads[i]; h.t += h.speed*dt;
    if (h.t >= h.nseg + TAIL*h.gap){ h.dest.pulse = Math.min(1, h.dest.pulse + .03); heads[i] = heads[heads.length-1]; heads.pop(); }
  }
  const cnt = heads.length;
  for (let j=0; j<cnt; j++){
    const h = heads[j], vis = protoOn[h.proto] ? 1 : 0;
    const fin = h.t < 0 ? 0 : Math.min(1, h.t/.06);
    for (let k=0; k<PPH; k++){
      const idx = j*PPH + k, gt = h.t - k*h.gap;
      headPos(h, gt, _v);
      pPos[idx*3] = _v.x; pPos[idx*3+1] = _v.y; pPos[idx*3+2] = _v.z;
      pCol[idx*3] = h.col.r; pCol[idx*3+1] = h.col.g; pCol[idx*3+2] = h.col.b;
      const tail = Math.pow(1 - k/PPH, 1.6);
      const fout = Math.max(0, Math.min(1, (h.nseg - gt)/.1));
      pAlpha[idx] = vis * fin * fout * tail * (gt < 0 ? 0 : 1);
      pSize[idx] = h.size * (1 - k*.12);
    }
  }
  pGeo.setDrawRange(0, cnt*PPH);
  aPos.updateRange.count = cnt*PPH*3; aCol.updateRange.count = cnt*PPH*3;
  aSize.updateRange.count = cnt*PPH; aAlpha.updateRange.count = cnt*PPH;
  aPos.needsUpdate = aCol.needsUpdate = aSize.needsUpdate = aAlpha.needsUpdate = true;

  /* lanes */
  for (const s of segList){
    s.load += (s.tload - s.load)*Math.min(1, dt*3);
    const L = Math.log10(1 + s.load/2000);
    const target = s.load > 50 ? .05 + .45*Math.min(1, L/4.6) : 0;
    const m = s.line.material; m.opacity += (target - m.opacity)*Math.min(1, dt*3);
    s.col.lerp(PROTO[s.proto].color, Math.min(1, dt*2)); m.color.copy(s.col);
    if (s.tube){
      const tt = s.load > 1e6 ? Math.min(.32, (L-2.7)*.14) : 0;
      s.tube.material.opacity += (Math.max(0,tt) - s.tube.material.opacity)*Math.min(1, dt*2);
      s.tube.material.color.copy(s.col);
    }
  }

  /* stars breathe */
  for (const n of NODES){
    if (!n.visible) continue;
    n.pulse *= Math.pow(.2, dt); n.alert *= Math.pow(.35, dt);
    const thr = n.inRate + n.outRate;
    const L = n.online ? Math.log10(1 + thr/50000) : 0;
    const breath = n.online ? 1 + Math.sin(time*1.4 + n.phase)*.06 : 1;
    const g = (n.online ? 1 + L*.38 + n.pulse*.5 : .45) * breath;
    n.glow.scale.setScalar(n.size*6*g);
    n.core.scale.setScalar(n.size*.55*(n.online ? 1 + L*.08 : .8));
    tmpC.copy(n.online ? n.baseColor : grey);
    if (n.alert > .01) tmpC.lerp(red, Math.min(1, n.alert));
    n.glow.material.color.lerp(tmpC, Math.min(1, dt*4));
    n.core.material.color.lerp(tmpC, Math.min(1, dt*4));
    n.glow.material.opacity = n.online ? .9 : .12;
  }
  ringA.rotation.z += dt*.25; ringB.rotation.z -= dt*.15;
  ringA.material.color.copy(N.router.glow.material.color);
  dust.rotation.y += dt*.004;

  /* supernova bursts */
  for (let i=bursts.length-1; i>=0; i--){
    const b = bursts[i]; b.t += dt; const k = b.t/1.6;
    b.flash.scale.setScalar((4 + k*36)*b.power); b.flash.material.opacity = Math.max(0, 1 - k*1.4);
    b.ring.scale.setScalar((1 + k*28)*b.power); b.ring.material.opacity = Math.max(0, 1 - k);
    b.ring.lookAt(camera.position);
    if (k >= 1){ scene.remove(b.flash, b.ring); b.flash.material.dispose(); b.ring.material.dispose(); bursts.splice(i,1); }
  }

  /* camera */
  if (tween){
    const u = Math.min(1, (performance.now() - tween.s)/tween.d);
    const e = u < .5 ? 4*u*u*u : 1 - Math.pow(-2*u+2, 3)/2;
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (u >= 1) tween = null;
  } else if (focus){
    controls.target.lerp(focus.pos, Math.min(1, dt*2));
  }
  controls.update();

  shake *= Math.pow(.15, dt);
  const sh = REDUCED ? 0 : shake*.5;
  const ox = (Math.random()-.5)*sh, oy = (Math.random()-.5)*sh;
  camera.position.x += ox; camera.position.y += oy;
  if (composer) composer.render(); else renderer.render(scene, camera);
  camera.position.x -= ox; camera.position.y -= oy;

  /* labels */
  const w = innerWidth, hgt = innerHeight;
  for (const n of NODES){
    if (!n.visible){ continue; }
    proj.copy(n.pos); proj.y -= n.size*.9; proj.project(camera);
    if (proj.z > 1 || Math.abs(proj.x) > 1.2 || Math.abs(proj.y) > 1.2){ n.el.style.visibility = 'hidden'; continue; }
    n.el.style.visibility = 'visible';
    n.el.style.transform = `translate(${(proj.x*.5+.5)*w}px,${(-proj.y*.5+.5)*hgt + 4}px) translate(-50%,0)`;
  }
  requestAnimationFrame(frame);
}

/* warm up so the first frame already has traffic */
for (let i=0;i<10;i++) simTick();
note('观测站上线 · 正在接收模拟流量');
requestAnimationFrame(frame);
})();
</script>
